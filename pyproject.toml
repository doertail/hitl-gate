[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hitl-gate"
version = "0.1.1"
description = "A learnable 'should I ask a human?' gate for LangGraph human-in-the-loop steps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["langgraph>=1.0"]
keywords = ["langgraph", "human-in-the-loop", "hitl", "agents", "review", "learning-to-defer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.7"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
